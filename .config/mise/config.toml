# mise が管理するグローバル開発ツール (~/.config/mise/config.toml として配置)
# バージョン切り替えが必要なツールはここだけで管理し、macos/Brewfile と重複させない。
# リポジトリごとのバージョンは、そのリポジトリの mise 設定で上書きする。

[tools]
"aqua:secretlint/secretlint" = "13.0.5"
"aqua:suzuki-shunsuke/ghtkn" = "latest"
"aqua:gruntwork-io/terragrunt" = "latest"
"aqua:suzuki-shunsuke/tfcmt" = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
deno = "latest"
go = "latest"
golangci-lint = "latest"
node = "lts"
npm = "11"  # node 同梱版を上書きし、メジャーバージョンを固定する
pnpm = "latest"
terraform = "latest"
