## ============================================================================
## Codex ベース設定 (/etc/codex/config.toml として配置)
## ============================================================================

# Codex 起動時の設定マージ対象 (同じキーは ~/.codex 側を優先)
# - /etc/codex/config.toml : この dotfiles が提供するベース設定
# - ~/.codex/config.toml   : Codex のローカル設定 (git 管理外)


## ============================================================================
## コア設定
## ============================================================================

# メインモデル
model        = "gpt-5.6-sol"  # 通常タスク用モデル
review_model = "gpt-5.6-sol"  # コードレビュー用モデル

# 推論関連
model_reasoning_effort   = "xhigh"   # 推論の深さ (low / medium / high / xhigh)
model_reasoning_summary  = "auto"    # 推論要約の形式 (auto / concise / detailed / none)
hide_agent_reasoning     = true      # エージェント推論過程を非表示
show_raw_agent_reasoning = false     # 生の推論データを非表示

# 応答スタイル
personality = "pragmatic"  # 性格プリセット (none / friendly / pragmatic)

# Web 検索
web_search = "live"  # Web 検索モード (disabled / cached / live)

# 認証情報の保管場所
# Codex 自身の認証情報は file 保管とし、外部 CLI の credential store と分ける。
# Git などが credential helper 経由で Keychain を内部利用することは制限しない。
# ~/.codex/auth.json は Claude 側の組み込み Read deny に登録済み
cli_auth_credentials_store = "file"  # CLI 認証情報の保存先 (auto / keyring / file)


## ============================================================================
## 承認ポリシー & パーミッション
## ============================================================================

approval_policy     = "on-request"          # 操作の承認要否 (untrusted / on-request / never)
default_permissions = "保護付きフルアクセス"  # AI エージェント内部データと shell 履歴を除くフルアクセスを既定にする


## ============================================================================
## 既定許可と AI エージェント内部データの保護
## ============================================================================
#
# ルート全体を読み書き可能にし、外部 CLI が内部利用する認証材は deny しない。
# Codex / Claude Code 自身の認証・履歴と shell 履歴だけを固定 deny にする。
# その他の認証情報の直接取得は AGENTS.md と PreToolUse で拒否する。
# permission profile は旧 sandbox_mode / [sandbox_workspace_write] と併用しない。
[permissions."保護付きフルアクセス"]
description = "AI エージェント内部データと shell 履歴を除くフルアクセス"

[permissions."保護付きフルアクセス".filesystem]
":root" = "write"
"~/.codex/plugins/cache/openai-bundled/browser" = "read"  # 信頼済み Browser RPC のコードを変更不可にする

# Git、クラウド、コンテナ、パッケージ管理 CLI の設定・認証ストア、
# 秘密鍵、keystore、service-account、環境ファイルは
# filesystem deny に入れない。CLI 自身による通常利用を既定で許可し、
# 内容の直接取得と秘密値を返す操作だけを PreToolUse で拒否する。

# AI エージェントの認証情報・履歴
"~/.codex/auth.json"                          = "deny"
"~/.codex/history.jsonl"                      = "deny"
"~/.codex/sessions"                           = "deny"
"~/.codex/archived_sessions"                  = "deny"
"~/.codex/shell_snapshots"                    = "deny"
"~/.claude/.credentials.json"                 = "deny"
"~/.claude/history.jsonl"                     = "deny"
"~/.claude/projects"                          = "deny"
"~/.claude/file-history"                      = "deny"
"~/.claude/paste-cache"                       = "deny"
"~/.claude/shell-snapshots"                   = "deny"
"~/.claude.json"                              = "deny"
"~/.claude.json.backup"                       = "deny"
"~/.claude/backups"                           = "deny"

# シェル履歴
"~/.zsh_history"                              = "deny"
"~/.bash_history"                             = "deny"
"~/.zsh_sessions"                             = "deny"
"~/.bash_sessions"                            = "deny"
"~/.local/share/fish/fish_history"            = "deny"


[permissions."保護付きフルアクセス".network]
enabled = true  # コマンドのネットワークアクセスを制限しない


## ============================================================================
## シェル環境
## ============================================================================

[shell_environment_policy]
inherit                 = "all"   # CLI の通常設定を継承し、秘密値だけを下で除外する
ignore_default_excludes = true    # TOKEN_FILE などの非秘密パスまで落とす既定除外は使わない
set                     = { GIT_TERMINAL_PROMPT = "0", AWS_PAGER = "" }  # Git の認証待ちと AWS の外部 pager 起動を防ぐ

# 除外パターンは正式なテーブル表記で書く。
# 旧来の exclude / include_only 配列とは併用できない (Codex が読み込み時に弾く)。
# filter 名は大文字小文字を区別しないため、同名の大小文字違いは重ねない。
# エージェントは秘密を環境変数へ設定しない新しいターミナルから起動する前提とし、
# 秘密値と、実行体・暗黙の引数を差し替える変数を除外する。
# `set` は filter 適用後に評価されるため、安全な空の AWS_PAGER は再設定される。
[shell_environment_policy.filters]
"*PASSWORD"                       = "exclude"
"*PASSPHRASE"                     = "exclude"
"*PASSWD"                         = "exclude"
"*_API_KEY"                       = "exclude"
"*_PRIVATE_KEY"                   = "exclude"
"*_SECRET"                        = "exclude"
"*_SECRET_KEY"                    = "exclude"
"*_TOKEN"                         = "exclude"
"API_KEY"                         = "exclude"
"PRIVATE_KEY"                     = "exclude"
"SECRET"                          = "exclude"
"TOKEN"                           = "exclude"
"AWS_ACCESS_KEY_ID"               = "exclude"
"AWS_BEARER_TOKEN_BEDROCK"        = "exclude"
"AWS_CONTAINER_AUTHORIZATION_TOKEN" = "exclude"
"AWS_SECRET_ACCESS_KEY"           = "exclude"
"AWS_SECURITY_TOKEN"              = "exclude"
"AWS_SESSION_TOKEN"               = "exclude"
"COMPOSER_AUTH"                   = "exclude"
"CREDENTIALS"                     = "exclude"
"DOCKER_AUTH_CONFIG"              = "exclude"
"GOOGLE_CREDENTIALS"              = "exclude"
"HELM_KUBETOKEN"                  = "exclude"
"PGPASSWORD"                      = "exclude"
"TF_TOKEN_*"                      = "exclude"
"AWS_PAGER"                       = "exclude"
"BASH_ENV"                        = "exclude"
"BROWSER"                         = "exclude"
"DOCKER_CLI_PLUGIN_EXTRA_DIRS"    = "exclude"
"EDITOR"                          = "exclude"
"GH_BROWSER"                      = "exclude"
"GH_EDITOR"                       = "exclude"
"GH_PAGER"                        = "exclude"
"GIT_ASKPASS"                     = "exclude"
"GIT_CONFIG"                      = "exclude"
"GIT_CONFIG_COUNT"                = "exclude"
"GIT_CONFIG_GLOBAL"               = "exclude"
"GIT_CONFIG_KEY_*"                = "exclude"
"GIT_CONFIG_PARAMETERS"           = "exclude"
"GIT_CONFIG_SYSTEM"               = "exclude"
"GIT_CONFIG_VALUE_*"              = "exclude"
"GIT_EDITOR"                      = "exclude"
"GIT_EXEC_PATH"                   = "exclude"
"GIT_EXTERNAL_DIFF"               = "exclude"
"GIT_PAGER"                       = "exclude"
"GIT_PROXY_COMMAND"               = "exclude"
"GIT_SEQUENCE_EDITOR"             = "exclude"
"GIT_SSH"                         = "exclude"
"GIT_SSH_COMMAND"                 = "exclude"
"GIT_TEMPLATE_DIR"                = "exclude"
"LESSCLOSE"                       = "exclude"
"LESSOPEN"                        = "exclude"
"MANPAGER"                        = "exclude"
"PAGER"                           = "exclude"
"SHELLOPTS"                       = "exclude"
"SSH_ASKPASS"                     = "exclude"
"TERRAGRUNT_AUTH_PROVIDER_CMD"    = "exclude"
"TERRAGRUNT_IAC_ENGINE"           = "exclude"
"TERRAGRUNT_TFPATH"               = "exclude"
"TF_CLI_ARGS*"                    = "exclude"
"TF_REATTACH_PROVIDERS"           = "exclude"
"TG_AUTH_PROVIDER_CMD"            = "exclude"
"TG_IAC_ENGINE"                   = "exclude"
"TG_TF_PATH"                      = "exclude"
"VISUAL"                          = "exclude"
"ZDOTDIR"                         = "exclude"
"npm_config_call"                 = "exclude"
"npm_config_script_shell"         = "exclude"


## ============================================================================
## ターミナル表示
## ============================================================================

[tui]
notifications          = true  # デスクトップ通知を有効化
status_line_use_colors = true  # ステータスラインの項目別色分けを有効化
# ステータスラインの表示項目は Codex と Claude で共用
status_line = [
  "model-with-reasoning",  # 使用モデルと推論レベル
  "current-dir",           # カレントディレクトリ
  "git-branch",            # Git ブランチ名
  "context-used",          # 使用中のコンテキスト量
  "five-hour-limit",       # 5 時間単位の利用上限
  "weekly-limit",          # 週次の利用上限
  "fast-mode",             # Fast モードの有効/無効
]

[tui.keymap.composer]
submit = "ctrl-enter"  # Ctrl+Enter で送信


## ============================================================================
## 履歴
## ============================================================================

[history]
persistence = "save-all"  # 履歴の永続化 (none / save-all)


## ============================================================================
## 機能フラグ
## ============================================================================

[features]
hooks              = true   # 共通 PreToolUse ガードを有効にする
shell_snapshot     = false  # shell 状態や環境変数を平文ファイルへ保存しない
prevent_idle_sleep = true  # アイドル時のスリープを防止


## ============================================================================
## 実行前ガード
## ============================================================================

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type          = "command"
command       = "$HOME/.claude/hooks/pre-bash-guard.sh"
timeout       = 30
statusMessage = "Bash コマンドを検査中"


## ============================================================================
## Plugins
## ============================================================================

# Browser
[plugins."browser@openai-bundled"]
enabled = true

# Chrome
[plugins."chrome@openai-bundled"]
enabled = true

# Computer Use
[plugins."computer-use@openai-bundled"]
enabled = true

# GitHub
[plugins."github@openai-curated"]
enabled = true

# Linear
[plugins."linear@openai-curated"]
enabled = true

# Slack
[plugins."slack@openai-curated"]
enabled = true

# Notion
[plugins."notion@openai-curated"]
enabled = true

# Documents
[plugins."documents@openai-primary-runtime"]
enabled = true

# PDF
[plugins."pdf@openai-primary-runtime"]
enabled = true

# Spreadsheets
[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

# Presentations
[plugins."presentations@openai-primary-runtime"]
enabled = true

# Template Creator
[plugins."template-creator@openai-primary-runtime"]
enabled = true

# Sites
[plugins."sites@openai-bundled"]
enabled = true

# Visualize
[plugins."visualize@openai-bundled"]
enabled = true


## ============================================================================
## Codex App
## ============================================================================

[desktop]
# 提案表示
ambient-suggestions-enabled = false  # 提案表示を無効化

# ブラウザ
"browser-family-enabled:chrome" = true  # Composer で Chrome のブラウザ参照を有効にする

# 入力操作
composerEnterBehavior                     = "cmdAlways"       # 常に Cmd/Ctrl+Enter で送信
hotkey-window-projectless-default-enabled = true              # グローバルホットキーでプロジェクトなしウィンドウを開く

# 実行中の follow-up
followUpQueueMode = "steer"  # 実行中の follow-up で現在の turn を steer

# Git 操作の指示
git-commit-instructions = "コミットメッセージは過去の履歴に合わせ、プレフィックスを付けず、簡潔な日本語で記述してください。"
git-pr-instructions     = "簡潔な日本語で記述してください。"

# 表示
conversationDetailMode    = "STEPS_COMMANDS"  # 会話詳細にステップとコマンドを表示
git-show-sidebar-pr-icons = true              # Git サイドバーに PR アイコンを表示
mac-menu-bar-enabled      = false             # メニューバー項目を表示しない
show-context-window-usage = true              # コンテキスト使用量を表示

# レビュー
reviewDelivery = "inline"  # レビュー結果をインラインで表示

# 電源管理
preventSleepWhileRunning             = true  # チャット実行中のスリープを防止
keepRemoteControlAwakeWhilePluggedIn = true  # 電源接続中の Remote Control で app suspension を防止

# ファイルを開く
[desktop.open-in-target-preferences]
global = "vscode"  # ファイルを開く既定ターゲット
