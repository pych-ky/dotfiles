## Codex App

[desktop]
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "persistent", "max", "ultra"]  # 推論強度の選択肢

ambient-suggestions-enabled = false  # 提案表示

"browser-family-enabled:chrome" = true  # Composer の Chrome 参照
"browser-family-enabled:edge"   = true    # Composer の Edge 参照

appshotSoundEnabled = false  # 撮影時の効果音

hotkey-window-projectless-default-enabled = true  # ホットキーでプロジェクトなしウィンドウを開く

followUpQueueMode     = "steer"  # 実行中の追加指示を現在の turn に反映
composerEnterBehavior = "enter"  # Enter で送信

# Git 操作
git-branch-prefix             = ""        # 作成ブランチの接頭辞
git-commit-instructions       = ""        # 指示は AGENTS.md に集約
git-pr-instructions           = ""
git-pull-request-merge-method = "squash"  # PR のマージ方式

# 表示
conversationDetailMode    = "STEPS_COMMANDS"  # 会話詳細にステップ・コマンドを表示
git-show-sidebar-pr-icons = true              # Git サイドバーの PR アイコン
mac-menu-bar-enabled      = false             # メニューバー項目
show-context-window-usage = true              # コンテキスト使用量の表示

reviewDelivery                 = "inline"          # レビュー結果の表示先
open-link-in-target-preference = "in-app-browser"  # リンクをアプリ内ブラウザで開く

# 電源管理
preventSleepWhileRunning             = true  # 実行中のスリープ防止
keepRemoteControlAwakeWhilePluggedIn = true  # 電源接続中の Remote Control でアプリ休止を防止

[desktop.open-in-target-preferences]
global = "vscode"  # ファイルを開く既定アプリ

[desktop.appearanceLightChromeTheme]
accent         = "#3a83f7"          # アクセントの基準色
accentSource   = "chatgpt"    # アカウントで選択したアクセント色に追従
contrast       = 45               # コントラスト
ink            = "#1a1c1f"            # 文字色
opaqueWindows  = false      # ウィンドウの透過を許可
surface        = "#ffffff"        # 背景色
fonts          = {}                 # 標準フォント
semanticColors = { diffAdded = "#00a240", diffRemoved = "#ba2623", skill = "#924ff7" }  # 差分の追加・削除とスキルの色
