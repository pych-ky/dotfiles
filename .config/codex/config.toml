 "**/pg_service.conf" = "deny", "**/pip.conf" = "deny", "**/*.pem" = "deny", "**/*.key" = "deny", "**/*.p12" = "deny", "**/*.pfx" = "deny", "**/*.p8" = "deny", "**/*.der" = "deny", "**/*.ppk" = "deny", "**/*.jks" = "deny", "**/*.keystore" = "deny", "**/*.kdbx" = "deny", "**/*service-account*.json" = "deny", "**/*service_account*.json" = "deny", "**/*application_default_credentials*.json" = "deny", "**/*.tfstate*" = "deny", "**/id_rsa*" = "deny", "**/id_dsa*" = "deny", "**/id_ed25519*" = "deny", "**/id_ecdsa*" = "deny" }, "~/.ssh" = "deny", "~/.aws" = "deny", "~/.kube" = "deny", "~/.ocm.json" = "deny", "~/.config/ocm/ocm.json*" = "deny", "~/Library/Application Support/ocm/ocm.json*" = "deny", "~/.config/helm/repositories.yaml*" = "deny", "~/.config/helm/registry/config.json*" = "deny", "~/Library/Preferences/helm/repositories.yaml*" = "deny", "~/Library/Preferences/helm/registry/config.json*" = "deny", "~/.gnupg" = "deny", "~/.netrc" = "deny", "~/.git-credentials" = "deny", "~/.pgpass" = "deny", "~/.pg_service.conf" = "deny", "~/.npmrc" = "deny", "~/.pypirc" = "deny", "~/.curlrc" = "deny", "~/.wgetrc" = "deny", "~/.bundle/config" = "deny", "~/.config/composer/auth.json" = "deny", "~/.composer/auth.json" = "deny", "~/.config/pypoetry/auth.toml" = "deny", "~/Library/Application Support/pypoetry/auth.toml" = "deny", "~/.config/pip/pip.conf" = "deny", "~/.pip/pip.conf" = "deny", "~/Library/Application Support/pip/pip.conf" = "deny", "/etc/pip.conf" = "deny", "/Library/Application Support/pip/pip.conf" = "deny", "~/.zsh_history" = "deny", "~/.bash_history" = "deny", "~/.zsh_sessions" = "deny", "~/.bash_sessions" = "deny", "~/.local/share/fish/fish_history" = "deny", "~/.local/share/uv/credentials*" = "deny", "~/.local/share/uv/credentials*/**" = "deny", "~/.config/gcloud" = "deny", "~/Library/Keychains" = "deny", "/Library/Keychains" = "deny", "~/.codex/auth.json" = "deny", "~/.codex/history.jsonl" = "deny", "~/.codex/sessions" = "deny", "~/.codex/sessions/**" = "deny", "~/.codex/archived_sessions" = "deny", "~/.codex/archived_sessions/**" = "deny", "~/.codex/shell_snapshots" = "deny", "~/.codex/shell_snapshots/**" = "deny", "~/.claude/.credentials.json" = "deny", "~/.claude/history.jsonl" = "deny", "~/.claude/projects" = "deny", "~/.claude/projects/**" = "deny", "~/.claude/file-history" = "deny", "~/.claude/file-history/**" = "deny", "~/.claude/paste-cache" = "deny", "~/.claude/paste-cache/**" = "deny", "~/.claude/shell-snapshots" = "deny", "~/.claude/shell-snapshots/**" = "deny", "~/.claude.json" = "deny", "~/.claude.json.backup" = "deny", "~/.claude/backups" = "deny", "~/.config/gh/hosts.yml*" = "deny", "~/.docker/config.json" = "deny", "~/.terraform.d/credentials.tfrc.json" = "deny", "~/.terraformrc" = "deny", "~/.vault-token" = "deny", "~/.azure" = "deny", "~/.config/containers/auth.json" = "deny", "~/.cargo/credentials" = "deny", "~/.cargo/credentials.toml" = "deny" }

[permissions.hardened.network]
enabled = true  # 従来の workspace-write と同様、コマンドのネットワークアクセスを許可


## ============================================================================
## シェル環境
## ============================================================================

[shell_environment_policy]
inherit                 = "core"  # 親シェルから環境変数を継承する範囲 (all / core / none)
ignore_default_excludes = false   # *KEY* / *SECRET* / *TOKEN* の既定除外を有効にする
set                     = { GIT_TERMINAL_PROMPT = "0" }  # Git の認証待ちを防ぐ

# 除外パターンは正式なテーブル表記で書く。
# 旧来の exclude / include_only 配列とは併用できない (Codex が読み込み時に弾く)。
# filter 名は大文字小文字を区別しないため、同名の大小文字違いは重ねない。
# エージェントは秘密を環境変数へ設定しない新しいターミナルから起動する前提とし、
# ここは取りこぼしを拾う防御として置く
[shell_environment_policy.filters]
"AWS_ACCESS_KEY_ID"               = "exclude"
"AWS_CONFIG_FILE"                 = "exclude"
"AWS_CONTAINER_AUTHORIZATION_TOKEN" = "exclude"
"AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE" = "exclude"
"AWS_CONTAINER_CREDENTIALS_FULL_URI" = "exclude"
"AWS_CONTAINER_CREDENTIALS_RELATIVE_URI" = "exclude"
"AWS_SECRET_ACCESS_KEY"           = "exclude"
"AWS_SECURITY_TOKEN"              = "exclude"
"AWS_SESSION_TOKEN"               = "exclude"
"AWS_SHARED_CREDENTIALS_FILE"     = "exclude"
"AWS_WEB_IDENTITY_TOKEN_FILE"     = "exclude"
"AZURE_*"                         = "exclude"
"BUNDLE_USER_CONFIG"              = "exclude"
"CARGO_HOME"                      = "exclude"
"CLOUDSDK_CONFIG"                 = "exclude"
"COMPOSER_AUTH"                   = "exclude"
"COMPOSER_HOME"                   = "exclude"
"DOCKER_CERT_PATH"                = "exclude"
"DOCKER_CONFIG"                   = "exclude"
"GH_CONFIG_DIR"                   = "exclude"
"GNUPGHOME"                       = "exclude"
"GOOGLE_APPLICATION_CREDENTIALS" = "exclude"
"HELM_CONFIG_HOME"                = "exclude"
"HELM_KUBETOKEN"                  = "exclude"
"HELM_REGISTRY_CONFIG"            = "exclude"
"HELM_REPOSITORY_CONFIG"          = "exclude"
"KUBECONFIG"                      = "exclude"
"NETRC"                           = "exclude"
"NPM_CONFIG_USERCONFIG"           = "exclude"
"OCM_CONFIG"                      = "exclude"
"PGPASSFILE"                      = "exclude"
"PGPASSWORD"                      = "exclude"
"PGSERVICEFILE"                   = "exclude"
"PGSSLKEY"                        = "exclude"
"PGSYSCONFDIR"                    = "exclude"
"PIP_CONFIG_FILE"                 = "exclude"
"REGISTRY_AUTH_FILE"              = "exclude"
"TF_CLI_CONFIG_FILE"              = "exclude"
"UV_CREDENTIALS_DIR"              = "exclude"
"WGETRC"                          = "exclude"


## ============================================================================
## ターミナル表示
## ============================================================================

[tui]
notifications          = true  # デスクトップ通知を有効化
status_line_use_colors = true  # ステータスラインの項目別色分けを有効化
# ステータスラインの表示項目は Codex と Claude で共用
status_line = [
  "model-with-reasoning",  # 使用モデルと推論レベル
  "current-dir",           # カレントディレクトリ
  "git-branch",            # Git ブランチ名
  "context-used",          # 使用中のコンテキスト量
  "five-hour-limit",       # 5 時間単位の利用上限
  "weekly-limit",          # 週次の利用上限
  "fast-mode",             # Fast モードの有効/無効
]


## ============================================================================
## 履歴
## ============================================================================

[history]
persistence = "save-all"  # 履歴の永続化 (none / save-all)


## ============================================================================
## 機能フラグ
## ============================================================================

[features]
shell_snapshot     = false  # shell 状態や環境変数を平文ファイルへ保存しない
prevent_idle_sleep = true  # アイドル時のスリープを防止


## ============================================================================
## MCP サーバー
## ============================================================================

# Context7
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]


## ============================================================================
## Plugins
## ============================================================================

# Browser
[plugins."browser@openai-bundled"]
enabled = true

# Chrome
[plugins."chrome@openai-bundled"]
enabled = true

# GitHub
[plugins."github@openai-curated"]
enabled = true

# Slack
[plugins."slack@openai-curated"]
enabled = true

# Notion
[plugins."notion@openai-curated"]
enabled = true

# Documents
[plugins."documents@openai-primary-runtime"]
enabled = true

# PDF
[plugins."pdf@openai-primary-runtime"]
enabled = true

# Spreadsheets
[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

# Presentations
[plugins."presentations@openai-primary-runtime"]
enabled = true

# Template Creator
[plugins."template-creator@openai-primary-runtime"]
enabled = true

# Sites
[plugins."sites@openai-bundled"]
enabled = true

# Visualize
[plugins."visualize@openai-bundled"]
enabled = true


## ============================================================================
## Codex App
## ============================================================================

[desktop]
# 提案表示
ambient-suggestions-enabled = false  # 提案表示を無効化

# 入力操作
composerEnterBehavior                     = "cmdIfMultiline"  # 複数行入力時は Cmd/Ctrl+Enter で送信
hotkey-window-projectless-default-enabled = true              # グローバルホットキーでプロジェクトなしウィンドウを開く

# 実行中の follow-up
followUpQueueMode = "steer"  # 実行中の follow-up で現在の turn を steer

# Git 操作の指示
git-commit-instructions = "コミットメッセージは過去の履歴に合わせ、プレフィックスを付けず、簡潔な日本語で記述してください。"
git-pr-instructions     = "簡潔な日本語で記述してください。"

# 表示
conversationDetailMode    = "STEPS_COMMANDS"  # 会話詳細にステップとコマンドを表示
git-show-sidebar-pr-icons = true              # Git サイドバーに PR アイコンを表示
show-context-window-usage = true              # コンテキスト使用量を表示

# レビュー
reviewDelivery = "inline"  # レビュー結果をインラインで表示

# 電源管理
preventSleepWhileRunning             = true  # チャット実行中のスリープを防止
keepRemoteControlAwakeWhilePluggedIn = true  # 電源接続中の Remote Control で app suspension を防止

# ファイルを開く
[desktop.open-in-target-preferences]
global = "vscode"  # ファイルを開く既定ターゲット
