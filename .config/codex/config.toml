## Codex ベース設定 (/etc/codex/config.toml として配置)

# 起動時に ~/.codex/config.toml (git 管理外) とマージし、同じキーはローカル設定を優先する


## コア設定

model        = "gpt-6-astra"  # 通常タスク用モデル
review_model = "gpt-6-astra"  # コードレビュー用モデル

# 推論関連
model_reasoning_effort   = "ultra"   # 推論の深さ
model_reasoning_summary  = "auto"    # 推論要約の形式 (auto / concise / detailed / none)
hide_agent_reasoning     = true      # エージェント推論過程を非表示
show_raw_agent_reasoning = false     # 生の推論データを非表示

personality = "pragmatic"  # 性格プリセット (none / friendly / pragmatic)

web_search = "live"  # Web 検索モード (disabled / cached / live)

# Codex の認証情報を外部 CLI の credential store と分け、~/.codex/auth.json を Claude の Read deny で保護する。
# Git などが credential helper 経由で Keychain を内部利用することは制限しない。
cli_auth_credentials_store = "file"  # CLI 認証情報の保存先 (auto / keyring / file)


## 承認ポリシー & パーミッション

approval_policy     = "on-request"          # 操作の承認要否 (untrusted / on-request / never)
approvals_reviewer  = "user"                # 追加承認はユーザーに確認する
default_permissions = "保護付きフルアクセス"


## 既定許可と認証情報・shell 履歴の保護
# Codex / Claude Code 自身の認証情報と shell 履歴・snapshot を固定 deny にする。
# 会話履歴・session transcript・file history・paste cache の調査は許可する。
# permission profile は旧 sandbox_mode / [sandbox_workspace_write] と併用しない。
[permissions."保護付きフルアクセス"]
description = "AI エージェントの認証情報と shell 履歴・snapshot を除くフルアクセス"

[permissions."保護付きフルアクセス".filesystem]
":root" = "write"
"~/.codex/plugins/cache/openai-bundled/browser" = "read"  # 信頼済み Browser RPC のコードを変更不可にする

# 外部 CLI の設定・認証ストア、秘密鍵、keystore、service-account、環境ファイルは、CLI の通常利用のため filesystem deny に含めない。
# 認証情報の直接取得は AGENTS.md で禁止し、内容の直接取得と秘密値を返す既知の操作を PreToolUse で拒否する。

# AI エージェントの認証情報・shell snapshot
"~/.codex/auth.json"                          = "deny"
"~/.codex/shell_snapshots"                    = "deny"
"~/.codex-account-*/auth.json"                = "deny"
"~/.codex-account-*/shell_snapshots"          = "deny"
"~/.codex-account-*/shell_snapshots/**"       = "deny"
"~/.claude/.credentials.json"                 = "deny"
"~/.claude/shell-snapshots"                   = "deny"
"~/.claude.json"                              = "deny"
"~/.claude.json.backup"                       = "deny"
"~/.claude/backups"                           = "deny"

# シェル履歴
"~/.zsh_history"                              = "deny"
"~/.bash_history"                             = "deny"
"~/.zsh_sessions"                             = "deny"
"~/.bash_sessions"                            = "deny"
"~/.local/share/fish/fish_history"            = "deny"


[permissions."保護付きフルアクセス".network]
enabled = true  # コマンドのネットワークアクセスを制限しない


## シェル環境

[shell_environment_policy]
inherit                 = "all"   # CLI の通常設定を継承し、秘密値だけを下で除外する
ignore_default_excludes = true    # TOKEN_FILE などの非秘密パスまで落とす既定除外は使わない
set                     = { GIT_TERMINAL_PROMPT = "0", AWS_PAGER = "" }  # Git の認証待ちと AWS の外部 pager 起動を防ぐ

# filters はテーブルで指定する。exclude / include_only 配列との併用は読み込み時に拒否される。
# filter 名は大文字小文字を区別しないため、大小文字違いを重ねない。
# 秘密を環境変数に設定していない新しいターミナルから起動し、非秘密の認証・実行設定を継承する。
[shell_environment_policy.filters]
"*PASSWORD"                       = "exclude"
"*PASSPHRASE"                     = "exclude"
"*PASSWD"                         = "exclude"
"*_API_KEY"                       = "exclude"
"*_PRIVATE_KEY"                   = "exclude"
"*_SECRET"                        = "exclude"
"*_SECRET_KEY"                    = "exclude"
"*_TOKEN"                         = "exclude"
"API_KEY"                         = "exclude"
"PRIVATE_KEY"                     = "exclude"
"SECRET"                          = "exclude"
"TOKEN"                           = "exclude"
"AWS_ACCESS_KEY_ID"               = "exclude"
"AWS_BEARER_TOKEN_BEDROCK"        = "exclude"
"AWS_CONTAINER_AUTHORIZATION_TOKEN" = "exclude"
"AWS_SECRET_ACCESS_KEY"           = "exclude"
"AWS_SECURITY_TOKEN"              = "exclude"
"AWS_SESSION_TOKEN"               = "exclude"
"COMPOSER_AUTH"                   = "exclude"
"CREDENTIALS"                     = "exclude"
"DOCKER_AUTH_CONFIG"              = "exclude"
# JSON とパスを兼用するため除外する。パス用途は GOOGLE_APPLICATION_CREDENTIALS を使う。
"GOOGLE_CREDENTIALS"              = "exclude"
"HELM_KUBETOKEN"                  = "exclude"
"PGPASSWORD"                      = "exclude"
"TF_TOKEN_*"                      = "exclude"


## ターミナル表示

[tui]
notifications          = true  # デスクトップ通知を有効化
status_line_use_colors = true  # ステータスラインの項目別色分けを有効化
# ステータスラインの表示項目は Codex と Claude で共用
status_line = [
  "model-with-reasoning",  # 使用モデルと推論レベル
  "permissions",           # 現在有効な permission profile または sandbox mode
  "current-dir",           # カレントディレクトリ
  "git-branch",            # Git ブランチ名
  "context-used",          # 使用中のコンテキスト量
  "five-hour-limit",       # 5 時間単位の利用上限
  "weekly-limit",          # 週次の利用上限
  "fast-mode",             # Fast モードの有効/無効
]

## 履歴

[history]
persistence = "save-all"  # 履歴の永続化 (none / save-all)


## 機能フラグ

[features]
hooks              = true   # 共通 PreToolUse ガードを有効にする
shell_snapshot     = false  # shell 状態や環境変数を平文ファイルへ保存しない
prevent_idle_sleep = true  # アイドル時のスリープを防止


## 実行前ガード

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type          = "command"
command       = "\"$HOME/.claude/hooks/pre-bash-guard.sh\" || exit 2"
timeout       = 30
statusMessage = "Bash コマンドを検査中"


