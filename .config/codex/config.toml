## ============================================================================
## Codex ベース設定 (/etc/codex/config.toml として配置)
## ============================================================================

# Codex 起動時の設定マージ対象 (同じキーは ~/.codex 側を優先)
# - /etc/codex/config.toml : この dotfiles が提供するベース設定
# - ~/.codex/config.toml   : Codex のローカル設定 (git 管理外)


## ============================================================================
## コア設定
## ============================================================================

# メインモデル
model        = "gpt-5.6-sol"  # 通常タスク用モデル
review_model = "gpt-5.6-sol"  # コードレビュー用モデル

# 推論関連
model_reasoning_effort   = "xhigh"   # 推論の深さ (low / medium / high / xhigh)
model_reasoning_summary  = "auto"    # 推論要約の形式 (auto / concise / detailed / none)
model_verbosity          = "low"     # 応答の詳細度 (low / medium / high)
hide_agent_reasoning     = true      # エージェント推論過程を非表示
show_raw_agent_reasoning = false     # 生の推論データを非表示

# 応答スタイル
personality = "pragmatic"  # 性格プリセット (none / friendly / pragmatic)

# Web 検索
web_search = "live"  # Web 検索モード (disabled / cached / live)

# 認証情報の保管場所
# macOS キーチェーンを AI ツールから利用しない方針のため file 保管とする。
# ~/.codex/auth.json は Claude 側の読み取り禁止パス (denyRead) に登録済み
cli_auth_credentials_store = "file"  # CLI 認証情報の保存先 (auto / keyring / file)


## ============================================================================
## 承認ポリシー & サンドボックス
## ============================================================================

approval_policy = "on-request"       # 操作の承認要否 (untrusted / on-request / never)
default_permissions = "hardened"     # 認証情報を読めない workspace 権限を既定にする


## ============================================================================
## 認証情報の読み取り禁止
## ============================================================================
#
# :workspace の保護を継承しつつ、機密ファイル・ディレクトリだけを deny する。
# 絶対パスと ~/path の双方で実際の読み取り拒否を確認済み (Codex 0.148.0)。
# permission profile は旧 sandbox_mode / [sandbox_workspace_write] と併用しない。
[permissions.hardened]
description = "認証情報の読み取りを禁止する既定プロファイル"
