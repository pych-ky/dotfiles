## Codex ベース設定 (/etc/codex/config.toml)
# 起動時に ~/.codex/config.toml (Git 管理外) とマージし、同じキーはローカルを優先


## コア設定

model        = "gpt-6-astra"  # 通常利用モデル
review_model = "gpt-6-astra"  # レビュー用モデル
service_tier = "default"      # 標準速度

model_reasoning_effort   = "ultra"  # 推論の深さ
model_reasoning_summary  = "auto"   # 推論要約の形式
hide_agent_reasoning     = true     # 推論過程を非表示
show_raw_agent_reasoning = false    # 生の推論データの表示

personality = "pragmatic"  # 応答スタイル

web_search = "live"  # Web 検索モード

suppress_unstable_features_warning = true  # 開発中機能の警告を非表示

# 認証情報を外部 CLI の store と分け、~/.codex/auth.json を Claude の Read deny で保護
cli_auth_credentials_store = "file"


## 承認ポリシー & パーミッション

# App の「フルアクセス」は approval_policy を never に上書きする
approval_policy     = "on-request"            # 承認方式
approvals_reviewer  = "user"                  # 承認の確認先
default_permissions = "保護付きフルアクセス"  # 既定の権限プロファイル


# 旧 sandbox_mode / [sandbox_workspace_write] とは併用しない
[permissions."保護付きフルアクセス"]
description = "AI エージェントの認証情報と shell 履歴・snapshot を除くフルアクセス"

[permissions."保護付きフルアクセス".filesystem]
":root"                                         = "write"                                         # ルート全体の読み書きを許可
"~/.codex/plugins/cache/openai-bundled/browser" = "read"  # 信頼済み Browser RPC の改変を防ぐ

# 外部 CLI の設定・認証ストア・秘密鍵・keystore・service-account・環境ファイルは内部利用のため deny 対象外

# エージェントの認証情報・snapshot へのアクセスを禁止
"~/.codex/auth.json"                    = "deny"
"~/.codex/shell_snapshots"              = "deny"
"~/.codex-account-*/auth.json"          = "deny"
"~/.codex-account-*/shell_snapshots"    = "deny"
"~/.codex-account-*/shell_snapshots/**" = "deny"
"~/.claude/.credentials.json"           = "deny"
"~/.claude/shell-snapshots"             = "deny"
"~/.claude.json"                        = "deny"
"~/.claude.json.backup"                 = "deny"
"~/.claude/backups"                     = "deny"

# シェル履歴へのアクセスを禁止
"~/.zsh_history"                   = "deny"
"~/.bash_history"                  = "deny"
"~/.zsh_sessions"                  = "deny"
"~/.bash_sessions"                 = "deny"
"~/.local/share/fish/fish_history" = "deny"


[permissions."保護付きフルアクセス".network]
enabled = true  # コマンドのネットワーク利用を許可


## シェル環境

[shell_environment_policy]
inherit                 = "all"                                          # 起動元の環境変数を継承
ignore_default_excludes = true                                           # TOKEN_FILE 等の非秘密パスを既定除外から保護
set                     = { GIT_TERMINAL_PROMPT = "0", AWS_PAGER = "" }  # Git 認証待ち・AWS 外部 pager を抑止

# 秘密値名に一致する環境変数を除外
# filters はテーブルで指定。exclude / include_only 配列との併用は読み込み時に拒否
# 名前は大小文字を区別しない
[shell_environment_policy.filters]
"*PASSWORD"                         = "exclude"
"*PASSPHRASE"                       = "exclude"
"*PASSWD"                           = "exclude"
"*_API_KEY"                         = "exclude"
"*_PRIVATE_KEY"                     = "exclude"
"*_SECRET"                          = "exclude"
"*_SECRET_KEY"                      = "exclude"
"*_TOKEN"                           = "exclude"
"API_KEY"                           = "exclude"
"PRIVATE_KEY"                       = "exclude"
"SECRET"                            = "exclude"
"TOKEN"                             = "exclude"
"AWS_ACCESS_KEY_ID"                 = "exclude"
"AWS_BEARER_TOKEN_BEDROCK"          = "exclude"
"AWS_CONTAINER_AUTHORIZATION_TOKEN" = "exclude"
"AWS_SECRET_ACCESS_KEY"             = "exclude"
"AWS_SECURITY_TOKEN"                = "exclude"
"AWS_SESSION_TOKEN"                 = "exclude"
"COMPOSER_AUTH"                     = "exclude"
"CREDENTIALS"                       = "exclude"
"DOCKER_AUTH_CONFIG"                = "exclude"
"GOOGLE_CREDENTIALS"                = "exclude"
"HELM_KUBETOKEN"                    = "exclude"
"PGPASSWORD"                        = "exclude"
"TF_TOKEN_*"                        = "exclude"


## ターミナル表示

[tui]
notifications          = true  # デスクトップ通知
status_line_use_colors = true  # ステータスラインの項目別色分け
# ステータスラインの表示項目
status_line            = [
  "model-with-reasoning",  # モデル・推論強度
  "permissions",           # 有効な権限プロファイル / sandbox mode
  "current-dir",           # 現在のディレクトリ
  "git-branch",            # ブランチ
  "context-used",          # コンテキスト使用量
  "five-hour-limit",       # 5 時間の利用上限
  "weekly-limit",          # 週次の利用上限
  "fast-mode",             # 高速モード
]

[history]
persistence = "save-all"  # 履歴の保存方式


## 機能フラグ

[features]
hooks              = true   # 共通 PreToolUse ガードを有効化
shell_snapshot     = false  # shell 状態・環境変数の平文保存を防ぐ
prevent_idle_sleep = true   # アイドル時のスリープ防止
memories           = true   # 会話からのメモリ生成・利用


## 実行前ガード

[[hooks.PreToolUse]]
matcher = "^Bash$"  # ガード対象のツール名

[[hooks.PreToolUse.hooks]]
type          = "command"
command       = "\"$HOME/.claude/hooks/pre-bash-guard.sh\" || exit 2"
timeout       = 30  # ガードの制限時間
statusMessage = "Bash コマンドを検査中"


## スキル

# 無効化するスキルの SKILL.md を絶対パスで指定
[[skills.config]]
path    = "/Users/pych-ky/ghq/github.com/pych-ky/agent-skills/skills/propose-agent-rules/SKILL.md"
enabled = false

[[skills.config]]
path    = "/Users/pych-ky/ghq/github.com/pych-ky/agent-skills/skills/check-chrome-compatibility/SKILL.md"
enabled = false

[[skills.config]]
path    = "/Users/pych-ky/ghq/github.com/pych-ky/agent-skills/skills/resolve-coderabbit/SKILL.md"
enabled = false


