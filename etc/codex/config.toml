# Codex ベース設定

# /etc/codex/config.toml へ配置。~/.codex/config.toml の同名キーを優先


## コア設定

model        = "gpt-6.1-sol"
review_model = "gpt-6.1-sol"

model_reasoning_effort  = "ultra"
model_reasoning_summary = "auto"
hide_agent_reasoning    = true  # codex exec の出力のみ

personality = "pragmatic"

web_search = "live"

suppress_unstable_features_warning = true

# 外部 CLI と分離し、~/.codex/auth.json を Claude の Read deny で保護
cli_auth_credentials_store = "file"


## 承認ポリシー / パーミッション

# App の「フルアクセス」は never に上書き
approval_policy     = "on-request"
approvals_reviewer  = "user"
default_permissions = "保護付きフルアクセス"

# 旧 sandbox_mode / [sandbox_workspace_write] とは併用しない
[permissions."保護付きフルアクセス"]
description = "CLI の内部認証を許可し、shell 履歴・snapshot 等を保護"

[permissions."保護付きフルアクセス".filesystem]
":root"                                         = "write"
"~/.codex/plugins/cache/openai-bundled/browser" = "read"  # Browser RPC の改変防止

# .claude.json・Codex の auth.json は内部利用のため deny 対象外。直接取得は共通規約と実行前ガードで禁止

### エージェントの認証情報・snapshot

"~/.claude.json.backup"                 = "deny"
"~/.claude/.credentials.json"           = "deny"
"~/.claude/backups"                     = "deny"
"~/.claude/shell-snapshots"             = "deny"
"~/.codex-account-*/.credentials.json"  = "deny"
"~/.codex-account-*/shell_snapshots"    = "deny"
"~/.codex-account-*/shell_snapshots/**" = "deny"
"~/.codex/.credentials.json"            = "deny"
"~/.codex/shell_snapshots"              = "deny"

### シェル履歴

"~/.bash_history"                  = "deny"
"~/.bash_sessions"                 = "deny"
"~/.local/share/fish/fish_history" = "deny"
"~/.zsh_history"                   = "deny"
"~/.zsh_sessions"                  = "deny"

[permissions."保護付きフルアクセス".network]
enabled = true


## シェル環境

[shell_environment_policy]
inherit                 = "all"
ignore_default_excludes = true                                           # *KEY*・*SECRET*・*TOKEN* 除外を避け、TOKEN_FILE 等を残す
set                     = { AWS_PAGER = "", GIT_TERMINAL_PROMPT = "0" }

# exclude / include_only 配列とは併用不可。名前は大小文字を区別しない
[shell_environment_policy.filters]
"*PASSPHRASE"              = "exclude"
"*PASSWD"                  = "exclude"
"*PASSWORD"                = "exclude"
"*_API_KEY"                = "exclude"
"*_PRIVATE_KEY"            = "exclude"
"*_SECRET"                 = "exclude"
"*_SECRET_KEY"             = "exclude"
"*_TOKEN"                  = "exclude"
"API_KEY"                  = "exclude"
"AWS_ACCESS_KEY_ID"        = "exclude"
"AWS_BEARER_TOKEN_BEDROCK" = "exclude"
"AWS_SECRET_ACCESS_KEY"    = "exclude"
"COMPOSER_AUTH"            = "exclude"
"CREDENTIALS"              = "exclude"
"DOCKER_AUTH_CONFIG"       = "exclude"
"GOOGLE_CREDENTIALS"       = "exclude"
"HELM_KUBETOKEN"           = "exclude"
"PRIVATE_KEY"              = "exclude"
"SECRET"                   = "exclude"
"TF_TOKEN_*"               = "exclude"
"TOKEN"                    = "exclude"


## 機能フラグ

[features]
hooks              = true
memories           = true
prevent_idle_sleep = true
shell_snapshot     = false  # shell 状態・環境変数の平文保存を避ける


## 実行前ガード

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type          = "command"
command       = "\"$HOME/.claude/hooks/pre-bash-guard.sh\" || exit 2"
timeout       = 30
statusMessage = "Bash コマンドを検査中"


## プラグイン

[plugins]
"browser@openai-bundled" = { enabled = true }
"chrome@openai-bundled" = { enabled = true }
"codex-app-tools@openai-bundled" = { enabled = true }
"computer-history@openai-bundled" = { enabled = true }
"computer-use@openai-bundled" = { enabled = true }
"documents@openai-primary-runtime" = { enabled = true }
"github@openai-curated-remote" = { enabled = true }
"linear@openai-curated-remote" = { enabled = true }
"pdf@openai-primary-runtime" = { enabled = true }
"presentations@openai-primary-runtime" = { enabled = true }
"spreadsheets@openai-primary-runtime" = { enabled = true }
"template-creator@openai-primary-runtime" = { enabled = true }
"unified-computer-use@openai-bundled" = { enabled = true }
"visualize@openai-bundled" = { enabled = true }


## ターミナル表示

[tui]
status_line = [
  "model-with-reasoning",
  "permissions",  # 権限プロファイル / sandbox mode
  "current-dir",
  "git-branch",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
  "fast-mode",
]


## Codex App

[desktop]
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "persistent", "max", "ultra"]

ambient-suggestions-enabled = false

appshotSoundEnabled = false

hotkey-window-projectless-default-enabled = true

followUpQueueMode = "steer"  # 実行中の turn に追加指示

### Git 操作

git-branch-prefix             = ""
git-pull-request-merge-method = "squash"

### 電源管理

keepRemoteControlAwakeWhilePluggedIn = true
preventSleepWhileRunning             = true

### 表示

git-show-sidebar-pr-icons = true
mac-menu-bar-enabled      = false
show-context-window-usage = true

### ライトテーマ

[desktop.appearanceLightChromeTheme]
accent         = "#3a83f7"
accentSource   = "chatgpt"  # アカウントの選択色に追従
contrast       = 45
fonts          = {}
ink            = "#1a1c1f"
opaqueWindows  = false
semanticColors = { diffAdded = "#00a240", diffRemoved = "#ba2623", skill = "#924ff7" }
surface        = "#ffffff"

### ファイルを開くアプリ

[desktop.open-in-target-preferences]
global = "vscode"
